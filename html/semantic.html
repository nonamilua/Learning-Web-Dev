        <div>
            <h1 id="main">My 3 favorite speedcubing algorithms</h1>
            These are my favorite algorithms to perform during a <em>speedsolve</em>. They are part of the popular CFOP
            method.
            <ol>
                <li>
                    <figure id="one">
                        <img src="PLL_U(b).png" alt="Depiction of which pieces need to swap places" width="110">
                        <figcaption>Ub Permutation. This permutation is one of the easiest and shortest PLL algorithms.
                            I like it better than Ub because it doesn't require backflick finger tricks.</figcaption>
                    </figure>
                    <pre>M2 U' M' U2 M U' M2</pre>
                </li>
                <li>
                    <figure id="two">
                        <img src="T.gif" alt="Depiction of which pieces need to swap places" width="90">
                        <figcaption>T permutation. Even though it's a little long, I find this to be the most satisfying
                            and consistent algorithm to execute. It flows super fast and has great finger tricks. Most
                            of my PBs ended with a T-perm, if not a PLL skip &#128517;.</figcaption>
                    </figure>
                    <pre>R U R' U' R' F R2 U' R' U' R U R' F'</pre>
                </li>
                <li>
                    <figure id="three">
                        <img src="OLL_23.png" alt="Depiction of which pieces need to be oriented" width="110">
                        <figcaption>OLL 23 ("U-OLL"). Definitely not the easiest OLL to execute, but it is extremely
                            fast to recognize, and I personally find the algorithm to be very satisfying to perform.
                        </figcaption>
                        <pre>R2 D R' U2' R D' R' U2' R'</pre>
                    </figure>
                </li>
            </ol>
        </div>
